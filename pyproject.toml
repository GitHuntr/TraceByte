[project]
name = "tracebyte"
version = "0.1.0"
description = "FileCarveLab - File Signature Carving Evaluation (Digital Forensics PBL, DF-PBL-016)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow",
]
